[package]
name = "mp_anafis"
version = "0.1.0"
edition = "2024"
authors = ["CokieMiner"]
description = "High-performance arbitrary-precision arithmetic in pure Rust"
license = "Apache-2.0"
repository = "https://github.com/CokieMiner/MpAnafis"
rust-version = "1.93.0"
keywords = ["bigint", "arbitrary-precision", "multiprecision", "numerics", "no-std"]
categories = ["mathematics", "science"]

include = [
    "/src/**",
    "/build.rs",
    "/build_support/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[features]
default = []
std = []
num-traits = ["dep:num-traits"]

# Enables threaded execution through Rayon's global or currently active pool.
# First global resolution attempts physical-core narrowing below available
# parallelism. RAYON_NUM_THREADS, an existing pool, or unknown topology preserves
# Rayon's configuration; see the README's "Default pool sizing" section.
rayon = ["std", "dep:rayon"]

# Exposes algorithmic threshold parameters and tuning interfaces in `tune_api/`
# for `mp-tune` and external benchmark comparisons.
_internal-tune = ["std"]

[dependencies]
num-traits = { version = "0.2", optional = true, default-features = false }
rayon = { version = "1.10", optional = true, default-features = false }

[dev-dependencies]
divan = "0.1.21"
proptest = "1.11.0"

[target.'cfg(all(target_arch = "x86_64", target_pointer_width = "64"))'.dev-dependencies]
# External integer comparators are used by benches/; fuzz/ has its own manifest.
gmp-mpfr-sys = { version = "1.7.1", default-features = false, features = ["force-cross"] }
rug = { version = "1.30", default-features = false, features = ["integer", "std"] }

[[bench]]
name = "public_api"
path = "benches/public_api/main.rs"
harness = false
required-features = ["std"]

# Links the system GMP and FLINT for the `compare` group.
[[bench]]
name = "internal_improvement"
path = "benches/internal_improvement/main.rs"
harness = false
required-features = ["_internal-tune"]

[[test]]
name = "global_precision"
path = "src/int/logic/tests/precision.rs"

[[bin]]
name = "mp-tune"
path = "tools/tune/main.rs"
required-features = ["_internal-tune"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.build-override]
opt-level = 3

[profile.test]
opt-level = 2

[profile.bench]
strip = false
debug = true

# ============================================================================
# Lints Configuration: applies crate-wide. Scoped exceptions must use
# #![expect(...)] or #[expect(...)] with an explicit reason = "...".
# ============================================================================
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
let_underscore_drop = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
unused_results = "deny"
variant_size_differences = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# =============================================================================
# CODE QUALITY & STYLE (RESTRICTION)
# =============================================================================
alloc_instead_of_core = "deny"           # Use core for better portability
allow_attributes_without_reason = "deny" # Require explicit reasons for lint allowances
arithmetic_side_effects = "deny"         # Require checked or bounded arithmetic operations
as_conversions = "deny"                  # Prevent truncation risks from primitive casts
clone_on_ref_ptr = "deny"                # Avoid pointer indirection on reference-counted types
cognitive_complexity = "deny"            # Limit function cognitive complexity
create_dir = "deny"                      # Require explicit error handling for directory creation
dbg_macro = "deny"                       # Prohibit debug macro artifacts in production code
empty_drop = "deny"                      # Detect empty Drop implementations
empty_structs_with_brackets = "deny"     # Require unit struct syntax without empty brackets
exit = "deny"                            # Prohibit process exit in library code
filetype_is_file = "deny"                # Require robust file type verification
float_cmp_const = "deny"                 # Prevent direct equality comparisons on float constants
fn_to_numeric_cast = "deny"              # Prevent function pointer numeric casts
format_push_string = "deny"              # Prefer write! formatting over repeated heap push
get_unwrap = "deny"                      # Prefer direct indexing over get().unwrap()
if_then_some_else_none = "deny"          # Prefer bool::then_some for optional branching
indexing_slicing = "deny"                # Prohibit unchecked slice indexing
inline_asm_x86_intel_syntax = "deny"     # Enforce Intel syntax for x86 inline assembly
integer_division = "deny"                # Catch unintended integer truncation in divisions
large_include_file = "deny"              # Prevent embedding oversized files at compile time
let_underscore_must_use = "deny"         # Prevent discarding must-use return values
lossy_float_literal = "deny"             # Prevent loss of precision in floating-point literals
map_err_ignore = "deny"                  # Preserve error context across map_err transforms
mem_forget = "deny"                      # Prohibit mem::forget usage
missing_assert_message = "deny"          # Require descriptive panic messages in assertions
mixed_read_write_in_expression = "deny"  # Avoid subtle bugs in complex expressions
mutex_atomic = "deny"                    # Prefer atomic primitives over single-value mutexes
non_ascii_literal = "deny"               # Enforce 7-bit ASCII literals for portability
panic_in_result_fn = "deny"              # Prohibit panic in Result-returning functions
partial_pub_fields = "deny"              # Enforce uniform visibility across struct fields
print_stderr = "deny"                    # Prohibit stderr writes in library code
print_stdout = "deny"                    # Prohibit stdout writes in library code
pub_without_shorthand = "deny"           # Enforce standard pub visibility syntax
rc_buffer = "deny"                       # Avoid reference-counted buffer indirection
rc_mutex = "deny"                        # Prevent Mutex inside reference-counted types
redundant_type_annotations = "deny"      # Eliminate redundant explicit type annotations
rest_pat_in_fully_bound_structs = "deny" # Enforce explicit field matching in patterns
same_name_method = "deny"                # Avoid confusing method names
self_named_module_files = "deny"         # Enforce consistent module file naming
semicolon_inside_block = "deny"          # Enforce uniform semicolon placement
shadow_reuse = "deny"                    # Prevent accidental variable name shadowing
std_instead_of_alloc = "deny"            # Prefer alloc over std for no-std compatibility
std_instead_of_core = "deny"             # Prefer core over std for no-std compatibility
shadow_unrelated = "deny"                # Prevent variable shadowing across distinct types
single_char_lifetime_names = "deny"      # Require descriptive lifetime identifiers
host_endian_bytes = "deny"               # Prevent implicit host-endian byte conversions
exhaustive_enums = "deny"                # Require non-exhaustive annotations on enums
exhaustive_structs = "deny"              # Require non-exhaustive annotations on structs
unnecessary_self_imports = "deny"        # Eliminate redundant self imports
unneeded_field_pattern = "deny"          # Clean pattern matching
unwrap_in_result = "deny"                # Prohibit unwrap inside Result-returning functions
unseparated_literal_suffix = "deny"      # Enforce explicit separation of literal suffixes
use_debug = "deny"                       # Prohibit Debug trait usage in Display implementations
verbose_file_reads = "deny"              # Prefer read_to_string over manual buffer reading
wildcard_enum_match_arm = "deny"         # Prohibit wildcard enum match arms

# =============================================================================
# PERFORMANCE (HPC FOCUSED)
# =============================================================================
large_stack_arrays = "deny"              # Guard against excessive stack frame allocations
perf = { level = "deny", priority = -1 }
str_to_string = "deny"                   # Avoid heap string allocations from string slices
string_add = "deny"                      # Prevent string addition with operators
string_slice = "deny"                    # Prevent unnecessary owned string indexing
suboptimal_flops = "deny"                # Enforce numerically optimal floating-point forms

# =============================================================================
# ROBUSTNESS & ERROR HANDLING
# =============================================================================
debug_assert_with_mut_call = "deny"      # Prohibit mutating method calls inside debug assertions
missing_panics_doc = "deny"              # Document when functions can panic
panic = "deny"                           # Prohibit explicit panic calls in library code
todo = "deny"                            # Prohibit todo placeholder macros
try_err = "deny"                         # Enforce consistent use of the try operator
undocumented_unsafe_blocks = "deny"      # Require SAFETY comments on all unsafe blocks
unimplemented = "deny"                   # Prohibit unimplemented placeholder macros
unreachable = "deny"                     # Prohibit unreachable placeholder macros
unwrap_used = "deny"                     # Prohibit bare unwrap calls: require contextual expect

# =============================================================================
# MATH PRECISION & CORRECTNESS
# =============================================================================
imprecise_flops = "deny"                 # Enforce precise floating-point mathematical operations
suspicious_xor_used_as_pow = "deny"      # Catch accidental XOR operator usage for exponentiation
