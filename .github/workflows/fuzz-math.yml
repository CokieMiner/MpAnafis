name: Fuzz MpUint

on:
  schedule:
    - cron: "17 1 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-math-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2
  FUZZ_SECONDS: 20400

jobs:
  fuzz:
    name: Fuzz math_ops
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ env.CARGO_FUZZ_VERSION }}

      - name: Add cargo-fuzz To PATH
        run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> "$GITHUB_PATH"

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install --root "${{ runner.tool_cache }}/cargo-fuzz" --version "${CARGO_FUZZ_VERSION}" cargo-fuzz --locked

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: fuzz -> target

      - name: Restore Evolving Corpus
        uses: actions/cache@v5
        with:
          path: fuzz/corpus/math_ops
          key: fuzz-corpus-math-ops-${{ github.run_id }}
          restore-keys: fuzz-corpus-math-ops-

      - name: Prepare Crash Directory
        run: mkdir -p "${RUNNER_TEMP}/fuzz-artifacts"

      - name: Build math_ops
        run: cargo fuzz build math_ops

      - name: Run math_ops
        run: |
          cargo fuzz run math_ops -- \
            -max_total_time="${FUZZ_SECONDS}" \
            -print_final_stats=1 \
            "-artifact_prefix=${RUNNER_TEMP}/fuzz-artifacts/"

      - name: Upload Crashing Inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: math-ops-crashes-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 30
